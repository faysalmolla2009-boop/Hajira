<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f6b4a">
<meta name="mobile-web-app-capable" content="yes">
<title>হাজিরা</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--g:#0f6b4a;--g2:#1a9468;--gl:#e3f3ec;--o:#d9531e;--ol:#fdebe3;--bg:#eef3f0;--tx:#16221d;--mu:#62736b;--ln:#dfe8e3}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:18px;-webkit-text-size-adjust:100%}
  html,body{margin:0;touch-action:manipulation;overscroll-behavior:none}
  body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
  button,input{font:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100vh}
  .pad{padding:16px 16px 40px}
  /* header */
  .top{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 22px;border-radius:0 0 26px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .who{display:flex;align-items:center;gap:14px;min-width:0}
  .hi{font-size:.8rem;opacity:.85}
  .nm{font-size:1.4rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.4rem;flex:none;border:3px solid #ffffff55}
  .av.lg{width:84px;height:84px;font-size:2.2rem}
  .av.sm{width:46px;height:46px;font-size:1.2rem;border:0}
  .ghost{background:#ffffff26;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600}
  .back{background:#ffffff26;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600}
  /* cards */
  .card{background:#fff;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 2px 10px #0b2a1c14}
  .hero{text-align:center;margin-top:-8px}
  .clock{font-size:3rem;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .date{color:var(--mu);margin-top:4px}
  .status{display:inline-block;margin-top:14px;padding:8px 18px;border-radius:99px;font-weight:700}
  .status.on{background:var(--gl);color:var(--g)}
  .status.off{background:#eceff0;color:var(--mu)}
  .since{margin-top:10px;color:var(--mu);font-size:.95rem}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .big{min-height:74px;border:0;border-radius:18px;font-size:1.35rem;font-weight:800;color:#fff;cursor:pointer}
  .big.in{background:var(--g)} .big.out{background:var(--o)}
  .big:disabled{opacity:.28}
  .big:active:not(:disabled){transform:scale(.97)}
  .msg{min-height:1.4em;margin-top:12px;font-weight:600;color:var(--g)}
  .msg.err{color:#b91c1c}
  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .tile{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;box-shadow:0 2px 10px #0b2a1c14}
  .tile b{display:block;font-size:1.05rem;line-height:1.3;color:var(--g)}
  .tile span{display:block;font-size:.78rem;color:var(--mu);margin-top:4px}
  .tiles.two{grid-template-columns:1fr 1fr}
  /* month nav */
  .mnav{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
  .mnav b{font-size:1.1rem}
  .mnav button{width:46px;height:46px;border-radius:14px;border:0;background:#fff;font-size:1.5rem;font-weight:700;color:var(--g);box-shadow:0 2px 8px #0b2a1c14}
  .mnav button:disabled{opacity:.3}
  /* history */
  .day{background:#fff;border-radius:18px;margin-top:12px;overflow:hidden;box-shadow:0 2px 10px #0b2a1c14}
  .dh{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:var(--gl);font-weight:700}
  .dh em{font-style:normal;color:var(--g)}
  .sess{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--ln)}
  .sess .tm{flex:1;font-size:.95rem}
  .badge{padding:4px 10px;border-radius:99px;font-size:.75rem;font-weight:700;background:#fff3cc;color:#8a6100}
  .badge.b{background:#e6e4ff;color:#4a3fb3}
  .warn{color:#b45309}
  .empty{text-align:center;color:var(--mu);padding:30px 10px}
  /* admin list */
  .emp{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 2px 10px #0b2a1c14;width:100%;border:0;text-align:left;color:inherit}
  .emp .info{flex:1;min-width:0}
  .emp .en{font-weight:700;font-size:1.1rem}
  .emp .es{font-size:.82rem;color:var(--mu);margin-top:3px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#c3cbc7}
  .dot.on{background:#22c55e}
  .emp .nums{text-align:right;font-size:.82rem;color:var(--mu)}
  .emp .nums b{display:block;color:var(--g);font-size:.95rem}
  .sec{margin:22px 4px 0;font-weight:700;color:var(--mu);font-size:.9rem}
  .prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 2px}
  /* login */
  .login{padding:calc(env(safe-area-inset-top) + 40px) 22px 40px}
  .logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px #0f6b4a44}
  .logo svg{width:50px;height:50px}
  .login h1{text-align:center;margin:0 0 4px;font-size:2rem}
  .login p{text-align:center;color:var(--mu);margin:0 0 24px}
  .login input{width:100%;font-size:1.1rem;padding:16px;border-radius:14px;border:2px solid var(--ln);margin-bottom:12px;background:#fff;outline:none}
  .login input:focus{border-color:var(--g2)}
  .btn{width:100%;min-height:58px;border:0;border-radius:16px;font-size:1.15rem;font-weight:700;background:var(--g);color:#fff}
  .btn.alt{background:#fff;color:var(--tx);border:2px solid var(--ln);margin-top:12px}
  .or{text-align:center;color:var(--mu);margin:18px 0 6px;font-size:.9rem}
  .err{color:#b91c1c;min-height:1.4em;margin:6px 2px;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty" style="padding-top:40vh">লোড হচ্ছে...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, where, orderBy, limit, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5qqAD7M3m2NIl8tns3oaV2KHFCHdUbvI",
  authDomain: "hajira-12e99.firebaseapp.com",
  projectId: "hajira-12e99",
  storageBucket: "hajira-12e99.firebasestorage.app",
  messagingSenderId: "654864532889",
  appId: "1:654864532889:web:e2f1c917aceabb9027ff08"
};
const ADMIN_EMAIL = "faysalmolla2009@gmail.com";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const root = document.getElementById("app");

let mode = null, cur = null, records = [], offset = 0, selected = null;
let unsub = null, timer = null, busy = false, flash = "", flashErr = false;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const bn = n => Number(n).toLocaleString("bn-BD");
const tfmt = d => d.toLocaleTimeString("bn-BD", { hour: "numeric", minute: "2-digit" });
const dfmt = d => d.toLocaleDateString("bn-BD", { weekday: "long", day: "numeric", month: "long" });
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const shiftOf = d => d.getHours() < 15 ? "সকাল" : "বিকাল";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function fmtDur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(m / 60), mm = m % 60;
  if (!h && !mm) return "০ মিনিট";
  return ((h ? bn(h) + " ঘণ্টা " : "") + (mm ? bn(mm) + " মিনিট" : "")).trim();
}
function avatar(name, cls = "") {
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<div class="av ${cls}" style="background:hsl(${h} 55% 38%)">${esc(name.charAt(0).toUpperCase())}</div>`;
}
function monthRange(off) {
  const n = new Date();
  return [new Date(n.getFullYear(), n.getMonth() + off, 1), new Date(n.getFullYear(), n.getMonth() + off + 1, 1)];
}
function monthLabel(off) {
  return monthRange(off)[0].toLocaleDateString("bn-BD", { month: "long", year: "numeric" });
}

/* আসা/যাওয়া জোড়া মিলিয়ে ডিউটির সেশন বানানো */
function sessionsOf(recs) {
  const out = []; let open = null;
  for (const r of recs) {
    if (r.type === "in") {
      if (open) out.push({ start: open, end: null, missed: true });
      open = r.t;
    } else if (open) { out.push({ start: open, end: r.t }); open = null; }
    else out.push({ start: null, end: r.t, orphan: true });
  }
  if (open) out.push({ start: open, end: null, ongoing: true });
  return out;
}
const sdate = s => s.start || s.end;
const inRange = (s, a, b) => { const d = sdate(s); return d >= a && d < b; };
const sdur = (s, now) => (s.start && (s.end || s.ongoing)) ? ((s.end || now) - s.start) : 0;
const sum = (list, now) => list.reduce((a, s) => a + sdur(s, now), 0);

/* ---------- login ---------- */
function showLogin(msg = "") {
  mode = null;
  root.innerHTML = `
  <div class="login">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h1>হাজিরা</h1>
    <p>আপনার নাম ও পিন দিয়ে ঢুকুন</p>
    <input id="u" placeholder="আপনার নাম (ইংরেজিতে)" autocapitalize="none" autocomplete="username">
    <input id="p" type="password" inputmode="numeric" placeholder="পিন" autocomplete="current-password">
    <button class="btn" id="go">ঢুকুন</button>
    <div class="err" id="err">${esc(msg)}</div>
    <div class="or">অ্যাডমিন?</div>
    <button class="btn alt" id="g">গুগল দিয়ে লগইন</button>
  </div>`;
  const err = document.getElementById("err");
  const go = async () => {
    const u = document.getElementById("u").value.trim().toLowerCase();
    const p = document.getElementById("p").value.trim();
    if (!u || !p) { err.textContent = "নাম ও পিন লিখুন"; return; }
    err.textContent = "";
    try { await signInWithEmailAndPassword(auth, u + "@shop.app", p); }
    catch (e) { err.textContent = e.code === "auth/network-request-failed" ? "ইন্টারনেট নেই" : "নাম বা পিন ভুল হয়েছে"; }
  };
  document.getElementById("go").onclick = go;
  document.getElementById("p").onkeydown = e => { if (e.key === "Enter") go(); };
  document.getElementById("g").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { err.textContent = "গুগল লগইন হয়নি (" + (e.code || "error") + ")"; }
  };
}

/* ---------- shared profile body ---------- */
function profileHTML(recs) {
  const now = new Date();
  const [ms, me] = monthRange(offset);
  const all = sessionsOf(recs);
  const month = all.filter(s => inRange(s, ms, me));
  const todayKey = dayKey(now);
  const today = all.filter(s => dayKey(sdate(s)) === todayKey);
  const days = new Map();
  month.forEach(s => { const k = dayKey(sdate(s)); if (!days.has(k)) days.set(k, []); days.get(k).push(s); });
  const keys = [...days.keys()].sort().reverse();
  const workedDays = keys.filter(k => sum(days.get(k), now) > 0).length;

  const rows = keys.map(k => {
    const list = days.get(k);
    const head = new Date(k + "T00:00:00").toLocaleDateString("bn-BD", { weekday: "long", day: "numeric", month: "short" });
    return `<div class="day"><div class="dh"><span>${head}</span><em>${fmtDur(sum(list, now))}</em></div>` +
      list.map(s => {
        const sh = s.start ? shiftOf(s.start) : shiftOf(s.end);
        let tm, du;
        if (s.orphan) { tm = `<span class="warn">আসা জমা নেই</span> → ${tfmt(s.end)}`; du = "—"; }
        else if (s.missed) { tm = `${tfmt(s.start)} → <span class="warn">যাওয়া জমা নেই</span>`; du = "—"; }
        else if (s.ongoing) { tm = `${tfmt(s.start)} → চলছে`; du = fmtDur(now - s.start); }
        else { tm = `${tfmt(s.start)} → ${tfmt(s.end)}`; du = fmtDur(s.end - s.start); }
        return `<div class="sess"><span class="badge ${sh === "বিকাল" ? "b" : ""}">${sh}</span><div class="tm">${tm}</div><b>${du}</b></div>`;
      }).join("") + `</div>`;
  }).join("");

  return `
  <div class="tiles">
    <div class="tile"><b>${fmtDur(sum(today, now))}</b><span>আজ</span></div>
    <div class="tile"><b>${fmtDur(sum(month, now))}</b><span>${offset === 0 ? "এই মাস" : "এই মাসে"}</span></div>
    <div class="tile"><b>${bn(workedDays)} দিন</b><span>কাজের দিন</span></div>
  </div>
  <div class="mnav">
    <button data-act="prev">‹</button><b>${monthLabel(offset)}</b>
    <button data-act="next" ${offset >= 0 ? "disabled" : ""}>›</button>
  </div>
  ${rows || `<div class="empty">এই মাসে কোনো হাজিরা নেই</div>`}`;
}

/* ---------- employee ---------- */
function renderEmp() {
  const now = new Date();
  const name = cur.email.split("@")[0];
  const all = sessionsOf(records);
  const last = all[all.length - 1];
  const open = last && last.ongoing ? last : null;
  root.innerHTML = `
  <div class="top">
    <div class="who">${avatar(name)}<div style="min-width:0"><div class="hi">স্বাগতম</div><div class="nm">${esc(cap(name))}</div></div></div>
    <button class="ghost" data-act="logout">লগআউট</button>
  </div>
  <div class="pad">
    <div class="card hero">
      <div class="clock">${tfmt(now)}</div>
      <div class="date">${dfmt(now)}</div>
      <div class="status ${open ? "on" : "off"}">${open ? "● ডিউটিতে আছেন" : "○ ডিউটিতে নেই"}</div>
      ${open ? `<div class="since">শুরু ${tfmt(open.start)} · চলছে ${fmtDur(now - open.start)}</div>` : ""}
      <div class="btns">
        <button class="big in" data-act="in" ${open ? "disabled" : ""}>আসলাম</button>
        <button class="big out" data-act="out" ${open ? "" : "disabled"}>গেলাম</button>
      </div>
      <div class="msg ${flashErr ? "err" : ""}">${esc(flash)}</div>
    </div>
    ${profileHTML(records)}
  </div>`;
}

async function mark(type) {
  if (busy) return;
  busy = true; flash = "";
  try {
    const n = new Date();
    const write = addDoc(collection(db, "attendance"), {
      uid: cur.uid, name: cur.email.split("@")[0], type,
      shift: shiftOf(n), day: dayKey(n), ts: serverTimestamp()
    });
    await Promise.race([write, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    flash = type === "in" ? "✓ আসার সময় জমা হয়েছে" : "✓ যাওয়ার সময় জমা হয়েছে"; flashErr = false;
  } catch { flash = "জমা নিশ্চিত হয়নি, ইন্টারনেট দেখুন"; flashErr = true; }
  busy = false; render();
  setTimeout(() => { flash = ""; render(); }, 4000);
}

/* ---------- admin ---------- */
function groupByName(recs) {
  const m = new Map();
  recs.forEach(r => { if (!m.has(r.name)) m.set(r.name, []); m.get(r.name).push(r); });
  return m;
}
function renderAdmin() {
  const now = new Date();
  const groups = groupByName(records);

  if (selected && groups.has(selected)) {
    const recs = groups.get(selected);
    const all = sessionsOf(recs);
    const last = all[all.length - 1];
    const open = last && last.ongoing ? last : null;
    root.innerHTML = `
    <div class="top" style="flex-direction:column;align-items:stretch">
      <div><button class="back" data-act="home">‹ ফিরে যান</button></div>
      <div class="prof">${avatar(selected, "lg")}<div class="nm">${esc(cap(selected))}</div>
        <div class="hi">${open ? "● ডিউটিতে আছেন · শুরু " + tfmt(open.start) : "○ ডিউটিতে নেই"}</div></div>
    </div>
    <div class="pad">${profileHTML(recs)}</div>`;
    return;
  }

  const [ms, me] = monthRange(offset);
  const todayKey = dayKey(now);
  let onDuty = 0, todayAll = 0;
  const cards = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([name, recs]) => {
    const all = sessionsOf(recs);
    const last = all[all.length - 1];
    const open = last && last.ongoing ? last : null;
    const t = sum(all.filter(s => dayKey(sdate(s)) === todayKey), now);
    const m = sum(all.filter(s => inRange(s, ms, me)), now);
    if (open) onDuty++;
    todayAll += t;
    return `<button class="emp" data-act="open" data-name="${esc(name)}">
      ${avatar(name, "sm")}
      <div class="info"><div class="en">${esc(cap(name))}</div>
        <div class="es"><span class="dot ${open ? "on" : ""}"></span>${open ? "ডিউটিতে · শুরু " + tfmt(open.start) : "ডিউটিতে নেই"}</div></div>
      <div class="nums"><b>${fmtDur(t)}</b>আজ<br><b>${fmtDur(m)}</b>মাসে</div>
    </button>`;
  }).join("");

  root.innerHTML = `
  <div class="top">
    <div class="who">${avatar("A")}<div style="min-width:0"><div class="hi">অ্যাডমিন</div><div class="nm">সবার হাজিরা</div></div></div>
    <button class="ghost" data-act="logout">লগআউট</button>
  </div>
  <div class="pad">
    <div class="tiles two">
      <div class="tile"><b>${bn(onDuty)} জন</b><span>এখন ডিউটিতে</span></div>
      <div class="tile"><b>${fmtDur(todayAll)}</b><span>আজ মোট ডিউটি</span></div>
    </div>
    <div class="mnav">
      <button data-act="prev">‹</button><b>${monthLabel(offset)}</b>
      <button data-act="next" ${offset >= 0 ? "disabled" : ""}>›</button>
    </div>
    <div class="sec">কর্মচারী (চাপলে পুরো প্রোফাইল)</div>
    ${cards || `<div class="empty">এখনো কারও হাজিরা জমা পড়েনি</div>`}
  </div>`;
}

/* ---------- wiring ---------- */
function render() { if (mode === "emp") renderEmp(); else if (mode === "admin") renderAdmin(); }

root.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "in" || a === "out") mark(a);
  else if (a === "logout") signOut(auth);
  else if (a === "prev") { offset--; render(); }
  else if (a === "next") { if (offset < 0) offset++; render(); }
  else if (a === "open") { selected = b.dataset.name; window.scrollTo(0, 0); render(); }
  else if (a === "home") { selected = null; render(); }
});

const toRec = d => { const x = d.data(); return { name: x.name, type: x.type, t: x.ts ? x.ts.toDate() : new Date() }; };

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (timer) { clearInterval(timer); timer = null; }
  records = []; offset = 0; selected = null; flash = "";
  if (!user) return showLogin();
  cur = user;
  if (user.email === ADMIN_EMAIL) {
    mode = "admin";
    unsub = onSnapshot(query(collection(db, "attendance"), orderBy("ts", "desc"), limit(3000)), snap => {
      records = snap.docs.map(toRec).sort((a, b) => a.t - b.t); render();
    }, () => { root.innerHTML = `<div class="empty" style="padding-top:30vh">ডেটা আনা যায়নি। ইন্টারনেট দেখুন।</div>`; });
  } else {
    mode = "emp";
    unsub = onSnapshot(query(collection(db, "attendance"), where("uid", "==", user.uid)), snap => {
      records = snap.docs.map(toRec).sort((a, b) => a.t - b.t); render();
    });
  }
  render();
  timer = setInterval(render, 20000);
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
