<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a7f5a">
<title>হাজিরা</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f3f5f4;color:#1b1b1b}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .wide{max-width:900px}
  h1{font-size:22px;margin:0 0 16px}
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
  input,select,button{font-size:17px;padding:13px;border-radius:10px;border:1px solid #ccd;width:100%;margin-bottom:10px}
  button{border:0;background:#1a7f5a;color:#fff;font-weight:600;cursor:pointer}
  button.out{background:#c2410c}
  button.ghost{background:#e5e7eb;color:#222}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #eee}
  .in{color:#1a7f5a;font-weight:600}.o{color:#c2410c;font-weight:600}
  .err{color:#b91c1c;margin:6px 0}
  .muted{color:#666;font-size:14px}
</style>
</head>
<body>
<div id="app" class="wrap">লোড হচ্ছে...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, where, orderBy, limit, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== এই অংশটুকু আপনাকে বদলাতে হবে (ফায়ারবেস থেকে পাবেন) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyB5qqAD7M3m2NIl8tns3oaV2KHFCHdUbvI",
  authDomain: "hajira-12e99.firebaseapp.com",
  projectId: "hajira-12e99",
  storageBucket: "hajira-12e99.firebasestorage.app",
  messagingSenderId: "654864532889",
  appId: "1:654864532889:web:e2f1c917aceabb9027ff08"
};
const ADMIN_EMAIL = "faysalmolla2009@gmail.com"; // আপনার নিজের গুগল ইমেইল
/* ================================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const root = document.getElementById("app");
let unsub = null;

const fmt = d => d.toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" });
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const shiftOf = d => d.getHours() < 15 ? "সকাল" : "বিকাল";

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) return showLogin();
  if (user.email === ADMIN_EMAIL) return showAdmin(user);
  showEmployee(user);
});

function showLogin(msg = "") {
  root.className = "wrap";
  root.innerHTML = `
    <h1>হাজিরা</h1>
    <div class="card">
      <b>কর্মচারী লগইন</b><br><br>
      <input id="u" placeholder="আপনার নাম (ইংরেজিতে)" autocapitalize="none" autocomplete="username">
      <input id="p" type="password" inputmode="numeric" placeholder="পিন" autocomplete="current-password">
      <button id="go">ঢুকুন</button>
      <div class="err" id="err">${msg}</div>
    </div>
    <div class="card">
      <b>অ্যাডমিন</b><br><br>
      <button class="ghost" id="g">গুগল দিয়ে লগইন</button>
    </div>`;
  document.getElementById("go").onclick = async () => {
    const u = document.getElementById("u").value.trim().toLowerCase();
    const p = document.getElementById("p").value.trim();
    try { await signInWithEmailAndPassword(auth, u + "@shop.app", p); }
    catch { document.getElementById("err").textContent = "নাম বা পিন ভুল হয়েছে"; }
  };
  document.getElementById("g").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch { document.getElementById("err").textContent = "গুগল লগইন হয়নি"; }
  };
}

function showEmployee(user) {
  const name = user.email.split("@")[0];
  root.className = "wrap";
  root.innerHTML = `
    <h1>স্বাগতম, ${name}</h1>
    <div class="card">
      <div class="muted" id="clock"></div><br>
      <div class="row">
        <button id="in">আসলাম</button>
        <button id="out" class="out">গেলাম</button>
      </div>
      <div class="err" id="msg"></div>
    </div>
    <div class="card"><b>আমার সাম্প্রতিক হাজিরা</b><br><br><div id="list"></div></div>
    <button class="ghost" id="so">লগআউট</button>`;
  const tick = () => document.getElementById("clock").textContent = "এখন: " + fmt(new Date());
  tick(); setInterval(tick, 20000);

  const mark = async type => {
    const msg = document.getElementById("msg");
    msg.textContent = "";
    try {
      const now = new Date();
      await addDoc(collection(db, "attendance"), {
        uid: user.uid, name, type,
        shift: shiftOf(now), day: dayKey(now),
        ts: serverTimestamp()
      });
      msg.style.color = "#1a7f5a";
      msg.textContent = type === "in" ? "আসার সময় জমা হয়েছে ✓" : "যাওয়ার সময় জমা হয়েছে ✓";
    } catch { msg.style.color = ""; msg.textContent = "জমা হয়নি, ইন্টারনেট দেখুন"; }
  };
  document.getElementById("in").onclick = () => mark("in");
  document.getElementById("out").onclick = () => mark("out");
  document.getElementById("so").onclick = () => signOut(auth);

  unsub = onSnapshot(query(collection(db, "attendance"), where("uid", "==", user.uid)), snap => {
    const rows = snap.docs.map(d => d.data())
      .map(r => ({ ...r, t: r.ts ? r.ts.toDate() : new Date() }))
      .sort((a, b) => b.t - a.t).slice(0, 15);
    document.getElementById("list").innerHTML = rows.length
      ? "<table>" + rows.map(r => `<tr><td class="${r.type === "in" ? "in" : "o"}">${r.type === "in" ? "আসা" : "যাওয়া"}</td><td>${r.shift}</td><td>${fmt(r.t)}</td></tr>`).join("") + "</table>"
      : "<span class='muted'>এখনো কিছু নেই</span>";
  });
}

function showAdmin(user) {
  root.className = "wrap wide";
  root.innerHTML = `
    <h1>অ্যাডমিন: হাজিরা দেখুন</h1>
    <div class="card">
      <div class="row">
        <select id="who"><option value="">সব কর্মচারী</option></select>
        <input id="day" type="date">
      </div>
      <button class="ghost" id="clr">ফিল্টার মুছুন</button>
      <div id="tbl"></div>
    </div>
    <button class="ghost" id="so">লগআউট</button>`;
  document.getElementById("so").onclick = () => signOut(auth);
  let all = [];
  const draw = () => {
    const who = document.getElementById("who").value;
    const day = document.getElementById("day").value;
    const rows = all.filter(r => (!who || r.name === who) && (!day || r.day === day));
    document.getElementById("tbl").innerHTML = rows.length
      ? "<table><tr><th>নাম</th><th></th><th>শিফট</th><th>সময়</th></tr>" +
        rows.map(r => `<tr><td>${r.name}</td><td class="${r.type === "in" ? "in" : "o"}">${r.type === "in" ? "আসা" : "যাওয়া"}</td><td>${r.shift}</td><td>${fmt(r.t)}</td></tr>`).join("") + "</table>"
      : "<span class='muted'>কিছু পাওয়া যায়নি</span>";
  };
  document.getElementById("who").onchange = draw;
  document.getElementById("day").onchange = draw;
  document.getElementById("clr").onclick = () => {
    document.getElementById("who").value = ""; document.getElementById("day").value = ""; draw();
  };
  unsub = onSnapshot(query(collection(db, "attendance"), orderBy("ts", "desc"), limit(500)), snap => {
    all = snap.docs.map(d => d.data()).map(r => ({ ...r, t: r.ts ? r.ts.toDate() : new Date() }));
    const sel = document.getElementById("who"), cur = sel.value;
    const names = [...new Set(all.map(r => r.name))].sort();
    sel.innerHTML = '<option value="">সব কর্মচারী</option>' + names.map(n => `<option>${n}</option>`).join("");
    sel.value = cur;
    draw();
  });
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
