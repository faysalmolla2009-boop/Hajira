<html lang="bn">
<head>

<style>
  :root{--g:#0f6b4a;--g2:#1a9468;--gl:#e3f3ec;--o:#d9531e;--bg:#eef3f0;--tx:#16221d;--mu:#62736b;--ln:#dfe8e3}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:18px;-webkit-text-size-adjust:100%}
  html,body{margin:0;touch-action:manipulation;overscroll-behavior:none}
  body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
  button,input,select{font:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100vh}
  .pad{padding:16px 16px 50px}
  .top{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 22px;border-radius:0 0 26px 26px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top.col{flex-direction:column;align-items:stretch}
  .who{display:flex;align-items:center;gap:14px;min-width:0}
  .hi{font-size:.8rem;opacity:.9}
  .nm{font-size:1.35rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.4rem;flex:none;border:3px solid #ffffff55;overflow:hidden}

  .av.lg{width:92px;height:92px;font-size:2.4rem}

  .ghost,.back{background:#ffffff26;color:#fff;border:0;border-radius:12px;padding:10px 13px;font-weight:600;white-space:nowrap}
  .tr{display:flex;gap:8px}
  .card{background:#fff;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 2px 10px #0b2a1c14}
  .hero{text-align:center;margin-top:-8px}
  .clock{font-size:3rem;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .date{color:var(--mu);margin-top:4px}
  .status{display:inline-block;margin-top:14px;padding:8px 18px;border-radius:99px;font-weight:700}
  .status.on{background:var(--gl);color:var(--g)} .status.off{background:#eceff0;color:var(--mu)}
  .since{margin-top:10px;color:var(--mu);font-size:.95rem}
  .cnt{margin-top:8px;color:var(--mu);font-size:.9rem}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .big{min-height:74px;border:0;border-radius:18px;font-size:1.3rem;font-weight:800;color:#fff}

  .msg{min-height:1.4em;margin-top:12px;font-weight:600;color:var(--g)} .msg.err{color:#b91c1c}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .tile{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;box-shadow:0 2px 10px #0b2a1c14}
  .tile b{display:block;font-size:1.05rem;line-height:1.3;color:var(--g)}
  .tile span{display:block;font-size:.78rem;color:var(--mu);margin-top:4px}
  .mnav{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
  .mnav b{font-size:1.1rem}
  .mnav button{width:46px;height:46px;border-radius:14px;border:0;background:#fff;font-size:1.5rem;font-weight:700;color:var(--g);box-shadow:0 2px 8px #0b2a1c14}
  .mnav button:disabled{opacity:.3}
  .day{background:#fff;border-radius:18px;margin-top:12px;overflow:hidden;box-shadow:0 2px 10px #0b2a1c14}
  .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--gl);font-weight:700;gap:8px}
  .dh em{font-style:normal;color:var(--g);font-size:.85rem;text-align:right}
  .sess{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--ln)}
  .sess .tm{flex:1;font-size:.95rem}
  .badge{min-width:28px;text-align:center;padding:4px 8px;border-radius:99px;font-size:.78rem;font-weight:700;background:#fff3cc;color:#8a6100}
  .tt{border-bottom:2px dashed #8fb3a1;padding-bottom:1px}
  .warn{color:#b45309}
  .empty{text-align:center;color:var(--mu);padding:30px 10px}
  .emp{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 2px 10px #0b2a1c14;width:100%;border:0;text-align:left;color:inherit}
  .emp .info{flex:1;min-width:0}
  .emp .en{font-weight:700;font-size:1.1rem}
  .emp .es{font-size:.82rem;color:var(--mu);margin-top:3px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#c3cbc7} .dot.on{background:#22c55e}
  .emp .nums{text-align:right;font-size:.8rem;color:var(--mu)} .emp .nums b{display:block;color:var(--g);font-size:.92rem}
  .sec{margin:24px 4px 0;font-weight:700;color:var(--mu);font-size:.9rem}
  .prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 2px;text-align:center}
  .act{display:flex;gap:10px;margin-top:14px}
  .cbtn{flex:1;text-align:center;padding:13px 6px;border-radius:14px;font-weight:700;text-decoration:none;color:#fff;font-size:.95rem}
  .c1{background:#16a34a}.c2{background:#2563eb}.c3{background:#0b7a4b}
  .prow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
  .prow:last-child{border-bottom:0}
  .x{color:#b91c1c;font-weight:800;padding:0 6px}
  .smallbtn{border:0;border-radius:10px;padding:8px 12px;background:var(--gl);color:var(--g);font-weight:700}
  .smallbtn.red{background:#fde8e8;color:#b91c1c}
  .lnk{display:inline-block;margin-top:6px;color:#2563eb;font-weight:700;font-size:.85rem;text-decoration:none}
  .note{color:var(--mu);font-size:.85rem;line-height:1.5;margin:12px 4px 0}
  .login{padding:calc(env(safe-area-inset-top) + 40px) 22px 40px}
  .logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px #0f6b4a44}
  .logo svg{width:50px;height:50px}
  .login h1{text-align:center;margin:0 0 4px;font-size:2rem}
  .login p{text-align:center;color:var(--mu);margin:0 0 24px}
  .login input,.f input,.f select{width:100%;font-size:1.05rem;padding:15px;border-radius:14px;border:2px solid var(--ln);margin-bottom:12px;background:#fff;outline:none}
  .f label{display:block;font-size:.85rem;color:var(--mu);font-weight:600;margin:0 2px 5px}
  .login input:focus,.f input:focus,.f select:focus{border-color:var(--g2)}
  .btn{width:100%;min-height:56px;border:0;border-radius:16px;font-size:1.1rem;font-weight:700;background:var(--g);color:#fff}
  .btn.alt{background:#fff;color:var(--tx);border:2px solid var(--ln)}
  .btn.red{background:#c0392b}
  .or{text-align:center;color:var(--mu);margin:18px 0 6px;font-size:.9rem}
  .err{color:#b91c1c;min-height:1.4em;margin:6px 2px;font-weight:600}
  .mbg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 24px);max-height:92vh;overflow:auto}
  .sheet h3{margin:0 0 16px;font-size:1.25rem}
  .pprev{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .ring{position:fixed;inset:0;background:linear-gradient(135deg,#d9531e,#f59e0b);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px}
  .ringc{background:#fff;border-radius:28px;padding:30px 22px;text-align:center;width:100%;max-width:420px;animation:sh .5s infinite}
  .ringc .rt{font-size:3.2rem;font-weight:800}
  @keyframes sh{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  button.cbtn{border:0;font:inherit;font-weight:700;font-size:.95rem}
  .udot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;margin-left:8px;vertical-align:middle}
  .sched{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .sched div{background:var(--gl);border-radius:12px;padding:10px;text-align:center;font-size:.8rem;color:var(--mu)}
  .sched b{display:block;color:var(--g);font-size:1rem}
  .tabs{display:flex;gap:8px;padding:12px 16px 0}
  .tabs button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:700;background:#fff;color:var(--mu);box-shadow:0 2px 8px #0b2a1c14}
  .tabs button.on{background:var(--g);color:#fff}
  .chatpad{padding:12px 14px 96px}
  .bub{max-width:82%;background:#fff;border-radius:16px 16px 16px 4px;padding:9px 13px;margin:8px 0;box-shadow:0 1px 4px #0b2a1c14;overflow-wrap:anywhere}
  .bub.me{margin-left:auto;background:var(--g);color:#fff;border-radius:16px 16px 4px 16px}
  .bub .bnm{font-size:.75rem;font-weight:700;color:var(--g2);margin-bottom:2px}
  .bub .bt{font-size:.68rem;opacity:.7;margin-top:3px;text-align:right}
  .chatbar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;box-shadow:0 -2px 12px #0b2a1c1f}
  .chatbar input{flex:1;font-size:1.05rem;padding:13px 14px;border-radius:14px;border:2px solid var(--ln);outline:none;min-width:0}
  .chatbar button{border:0;border-radius:14px;padding:0 18px;background:var(--g);color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty" style="padding-top:40vh">লোড হচ্ছে...</div></div>
<div id="modal"></div>
<div id="ring"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, Timestamp, query, where, orderBy, limit, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5qqAD7M3m2NIl8tns3oaV2KHFCHdUbvI",
  authDomain: "hajira-12e99.firebaseapp.com",
  projectId: "hajira-12e99",
  storageBucket: "hajira-12e99.firebasestorage.app",
  messagingSenderId: "654864532889",
  appId: "1:654864532889:web:e2f1c917aceabb9027ff08"
};
const ADMIN_EMAIL = "faysalmolla2009@gmail.com";
const MAX_PER_DAY = 3;

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const root = document.getElementById("app");
const modalEl = document.getElementById("modal");
const ringEl = document.getElementById("ring");

let mode = null, cur = null, myName = "";
let att = [], staffMap = new Map(), pays = [], alarms = [];
let offset = 0, view = "home", sel = null;
let unsubs = [], timer = null, atimer = null, busy = false, flash = "", flashErr = false;
let pendingPhoto = null, actx = null, ringTimer = null;
const ringedMem = new Set();

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const bn = n => Number(n).toLocaleString("bn-BD");
const tfmt = d => d.toLocaleTimeString("bn-BD", { hour: "numeric", minute: "2-digit" });
const dfmt = d => d.toLocaleDateString("bn-BD", { weekday: "long", day: "numeric", month: "long" });
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const shiftOf = d => d.getHours() < 15 ? "সকাল" : "বিকাল";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const disp = n => (staffMap.get(n) && staffMap.get(n).name) || cap(n);
const photoOf = n => staffMap.get(n) && staffMap.get(n).photo;
const fmtHM = t => { const [h, m] = t.split(":").map(Number); return tfmt(new Date(2000, 0, 1, h, m)); };
const hmOf = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
let restMem = 0;
const restKey = () => "restEnd_" + myName;
function getRestEnd() { try { return Number(localStorage.getItem(restKey())) || restMem; } catch { return restMem; } }
function setRestEnd(ms) { restMem = ms; try { if (ms) localStorage.setItem(restKey(), String(ms)); else localStorage.removeItem(restKey()); } catch {} }
const toLocalInput = d => dayKey(d) + "T" + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
function fmtDur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(m / 60), mm = m % 60;
  if (!h && !mm) return "০ মিনিট";
  return ((h ? bn(h) + " ঘণ্টা " : "") + (mm ? bn(mm) + " মিনিট" : "")).trim();
}
function avatar(name, cls = "") {
  const p = photoOf(name);
  if (p) return `<div class="av ${cls}"><img src="${p}" alt=""></div>`;
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<div class="av ${cls}" style="background:hsl(${h} 55% 38%)">${esc(disp(name).charAt(0).toUpperCase())}</div>`;
}
function monthRange(off) {
  const n = new Date();
  return [new Date(n.getFullYear(), n.getMonth() + off, 1), new Date(n.getFullYear(), n.getMonth() + off + 1, 1)];
}
const monthLabel = off => monthRange(off)[0].toLocaleDateString("bn-BD", { month: "long", year: "numeric" });

function sessionsOf(recs) {
  const out = []; let open = null;
  for (const r of recs) {
    if (r.type === "in") {
      if (open) out.push({ start: open.t, sid: open.id, end: null, missed: true });
      open = r;
    } else if (open) { out.push({ start: open.t, sid: open.id, end: r.t, eid: r.id }); open = null; }
    else out.push({ start: null, end: r.t, eid: r.id, orphan: true });
  }
  if (open) out.push({ start: open.t, sid: open.id, end: null, ongoing: true });
  return out;
}
const sdate = s => s.start || s.end;
const inRange = (s, a, b) => { const d = sdate(s); return d >= a && d < b; };
const sdur = (s, now) => (s.start && (s.end || s.ongoing)) ? ((s.end || now) - s.start) : 0;
const sum = (list, now) => list.reduce((a, s) => a + sdur(s, now), 0);
function dayRest(list) {
  let r = 0;
  for (let i = 1; i < list.length; i++) { const a = list[i-1], b = list[i]; if (a.end && b.start && b.start > a.end) r += b.start - a.end; }
  return r;
}
const openOf = recs => { const a = sessionsOf(recs); const l = a[a.length - 1]; return l && l.ongoing ? l : null; };

/* ডিউটির সময়সূচি ও ওভারটাইম */
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
function schedOf(st) { const s = st && st.sched; return s && s.in && s.bo && s.bi && s.out ? s : null; }
function stdMs(st) { const s = schedOf(st); return s ? ((toMin(s.bo) - toMin(s.in)) + (toMin(s.out) - toMin(s.bi))) * 60000 : 810 * 60000; }
const otRate = st => (st && Number(st.otRate)) || 6;
function overtimeIn(all, st, now, a, b) {
  const std = stdMs(st), per = new Map();
  all.filter(s => inRange(s, a, b)).forEach(s => { const k = dayKey(sdate(s)); per.set(k, (per.get(k) || 0) + sdur(s, now)); });
  let ms = 0; per.forEach(d => { if (d > std) ms += d - std; });
  return ms;
}
const otAmount = (ms, st) => Math.round(ms / 60000) * otRate(st) / 60;
const fmtMoney = v => bn(Math.round(v * 10) / 10);
const SCHED_LABELS = { in: "কাজে আসার সময়", bo: "রেস্টে যাওয়ার সময়", bi: "রেস্ট শেষ, কাজে ফিরুন", out: "ডিউটি শেষ" };
const SCHED_NAMES = { in: "IN", bo: "Break Out", bi: "Break In", out: "OUT" };
function schedAlarms() {
  const s = schedOf(staffMap.get(myName));
  return s ? Object.keys(SCHED_LABELS).map(k => ({ id: "sched_" + k, target: myName, time: s[k], label: SCHED_LABELS[k] })) : [];
}
function schedCardHTML(st) {
  const s = schedOf(st); if (!s) return "";
  return `<div class="card"><b>ডিউটির সময়সূচি</b><div class="sched">${["in", "bo", "bi", "out"].map(k => `<div><b>${fmtHM(s[k])}</b>${SCHED_NAMES[k]}</div>`).join("")}</div><div class="note" style="margin-top:10px">মোট কাজ ${fmtDur(stdMs(st))} · এর বেশি করলে ওভারটাইম (ঘণ্টায় ${bn(otRate(st))} টাকা)</div></div>`;
}

/* ---------- login ---------- */
function showLogin(msg = "") {
  mode = null;
  root.innerHTML = `
  <div class="login">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h1>হাজিরা</h1>
    <p>আপনার নাম ও পিন দিয়ে ঢুকুন</p>
    <input id="u" placeholder="আপনার নাম (ইংরেজিতে)" autocapitalize="none" autocomplete="username">
    <input id="p" type="password" inputmode="numeric" placeholder="পিন" autocomplete="current-password">
    <button class="btn" id="go">ঢুকুন</button>
    <div class="err" id="err">${esc(msg)}</div>
    <div class="or">অ্যাডমিন?</div>
    <button class="btn alt" id="g">গুগল দিয়ে লগইন</button>
  </div>`;
  const err = document.getElementById("err");
  const go = async () => {
    const u = document.getElementById("u").value.trim().toLowerCase();
    const p = document.getElementById("p").value.trim();
    if (!u || !p) { err.textContent = "নাম ও পিন লিখুন"; return; }
    err.textContent = "";
    try { await signInWithEmailAndPassword(auth, u + "@shop.app", p); }
    catch (e) { err.textContent = e.code === "auth/network-request-failed" ? "ইন্টারনেট নেই" : "নাম বা পিন ভুল হয়েছে"; }
  };
  document.getElementById("go").onclick = go;
  document.getElementById("p").onkeydown = e => { if (e.key === "Enter") go(); };
  document.getElementById("g").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { err.textContent = "গুগল লগইন হয়নি (" + (e.code || "error") + ")"; }
  };
}

/* ---------- shared blocks ---------- */
function contactBtns(phone, name) {
  const p = String(phone || "").replace(/[^\d+]/g, "");
  const wa = p.replace(/^\+/, "");
  return `<div class="act">${p ? `<a class="cbtn c1" href="tel:${p}">📞 কল</a>` : ""}<button class="cbtn c2" data-act="dm" data-name="${esc(name)}">💬 মেসেজ</button>${p ? `<a class="cbtn c3" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ""}</div>`;
}

function profileHTML(recs, canEdit, name) {
  const now = new Date();
  const [ms, me] = monthRange(offset);
  const all = sessionsOf(recs);
  const month = all.filter(s => inRange(s, ms, me));
  const todayKey = dayKey(now);
  const today = all.filter(s => dayKey(sdate(s)) === todayKey);
  const days = new Map();
  month.forEach(s => { const k = dayKey(sdate(s)); if (!days.has(k)) days.set(k, []); days.get(k).push(s); });
  const keys = [...days.keys()].sort().reverse();
  let monthRest = 0, workedDays = 0;
  const workedSet = new Set();
  keys.forEach(k => { monthRest += dayRest(days.get(k)); if (sum(days.get(k), now) > 0) { workedDays++; workedSet.add(k); } });
  const stf = staffMap.get(name) || {};
  const offDay = stf.offDay === undefined || stf.offDay === null ? -1 : Number(stf.offDay);
  let absent = 0;
  if (recs.length) {
    const f0 = recs[0].t;
    const startD = new Date(Math.max(ms.getTime(), new Date(f0.getFullYear(), f0.getMonth(), f0.getDate()).getTime()));
    const lastD = new Date(Math.min(me.getTime() - 86400000, new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1).getTime()));
    for (let d = startD; d <= lastD; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
      if (d.getDay() === offDay) continue;
      if (!workedSet.has(dayKey(d))) absent++;
    }
  }

  const rows = keys.map(k => {
    const list = days.get(k);
    const head = new Date(k + "T00:00:00").toLocaleDateString("bn-BD", { weekday: "long", day: "numeric", month: "short" });
    const rest = dayRest(list);
    const otm = Math.max(0, sum(list, now) - stdMs(stf));
    const ed = (id, txt) => canEdit && id ? `<span class="tt" data-act="editrec" data-id="${id}">${txt}</span>` : txt;
    return `<div class="day"><div class="dh"><span>${head}</span><em>ডিউটি ${fmtDur(sum(list, now))}${rest ? "<br>রেস্ট " + fmtDur(rest) : ""}${otm > 0 ? "<br>ওভারটাইম " + fmtDur(otm) + " · " + fmtMoney(otAmount(otm, stf)) + " টাকা" : ""}</em></div>` +
      list.map((s, i) => {
        let tm, du;
        if (s.orphan) { tm = `<span class="warn">আসা জমা নেই</span> → ${ed(s.eid, tfmt(s.end))}`; du = "—"; }
        else if (s.missed) { tm = `${ed(s.sid, tfmt(s.start))} → <span class="warn">যাওয়া জমা নেই</span>`; du = "—"; }
        else if (s.ongoing) { tm = `${ed(s.sid, tfmt(s.start))} → চলছে`; du = fmtDur(now - s.start); }
        else { tm = `${ed(s.sid, tfmt(s.start))} → ${ed(s.eid, tfmt(s.end))}`; du = fmtDur(s.end - s.start); }
        return `<div class="sess"><span class="badge">${bn(i + 1)}</span><div class="tm">${tm}</div><b>${du}</b></div>`;
      }).join("") + `</div>`;
  }).join("");

  return `
  ${schedCardHTML(stf)}
  <div class="tiles">
    <div class="tile"><b>${fmtDur(sum(today, now))}</b><span>আজ ডিউটি</span></div>
    <div class="tile"><b>${fmtDur(dayRest(today))}</b><span>আজ রেস্ট</span></div>
    <div class="tile"><b>${fmtDur(sum(month, now))}</b><span>মাসে ডিউটি</span></div>
    <div class="tile"><b>${fmtDur(monthRest)}</b><span>মাসের রেস্ট</span></div>
    <div class="tile"><b>${bn(workedDays)} দিন</b><span>উপস্থিত</span></div>
    <div class="tile"><b>${bn(absent)} দিন</b><span>অনুপস্থিত</span></div>
  </div>
  <div class="mnav">
    <button data-act="prev">‹</button><b>${monthLabel(offset)}</b>
    <button data-act="next" ${offset >= 0 ? "disabled" : ""}>›</button>
  </div>
  ${canEdit ? `<button class="btn alt" style="margin-top:12px" data-act="addrec" data-name="${esc(name)}">＋ ভুলে যাওয়া সময় যোগ করুন</button>` : ""}
  ${rows || `<div class="empty">এই মাসে কোনো হাজিরা নেই</div>`}
  ${canEdit ? `<div class="note">সময়ের নিচে ড্যাশ দাগ থাকা লেখায় চাপলে সময় বদলানো বা মুছে ফেলা যাবে।</div>` : ""}`;
}

function salaryHTML(name, canEdit) {
  const now = new Date();
  const st = staffMap.get(name) || {};
  const list = pays.filter(p => p.name === name).sort((a, b) => b.t - a.t);
  const recs = att.filter(r => r.name === name);
  const all = sessionsOf(recs);
  const [pms, pme] = monthRange(offset);
  const base = Number(st.salary) || 0;
  const otMs = overtimeIn(all, st, now, pms, pme);
  const otAmt = otAmount(otMs, st);
  const paidMonth = list.filter(p => p.t >= pms && p.t < pme).reduce((a, p) => a + p.amount, 0);
  const monthTotal = base + otAmt;
  const total = list.reduce((a, p) => a + p.amount, 0);
  let totalDue = null;
  if (recs.length && base) {
    const f1 = recs[0].t;
    const months = (now.getFullYear() - f1.getFullYear()) * 12 + (now.getMonth() - f1.getMonth()) + 1;
    totalDue = base * months + otAmount(overtimeIn(all, st, now, new Date(2000, 0, 1), new Date(2100, 0, 1)), st) - total;
  }
  const money = v => v > 0 ? fmtMoney(v) : (v < 0 ? fmtMoney(-v) + " (অগ্রিম)" : "০");
  return `
  <div class="card" style="margin-top:12px">
    <div class="prow"><span>মাসিক বেতন</span><b>${fmtMoney(base)}</b></div>
    <div class="prow"><span>ওভারটাইম ${fmtDur(otMs)}<br><small style="color:var(--mu)">ঘণ্টায় ${bn(otRate(st))} টাকা, প্রতি মিনিটে হিসাব</small></span><b>${fmtMoney(otAmt)}</b></div>
    <div class="prow"><span><b>এই মাসের মোট পাওনা</b></span><b>${fmtMoney(monthTotal)}</b></div>
    <div class="prow"><span>এই মাসে দেওয়া হয়েছে</span><b>${fmtMoney(paidMonth)}</b></div>
    <div class="prow"><span><b>এই মাসে বাকি</b></span><b>${money(monthTotal - paidMonth)}</b></div>
  </div>
  <div class="card">
    <div class="prow"><span>এ পর্যন্ত মোট দেওয়া</span><b>${fmtMoney(total)}</b></div>
    ${totalDue === null ? "" : `<div class="prow"><span>মোট বাকি (প্রথম হাজিরার মাস থেকে)</span><b>${money(totalDue)}</b></div>`}
  </div>
  <div class="sec">বেতন দেওয়ার তালিকা</div>
  <div class="card" style="margin-top:8px">
    ${canEdit ? `<button class="btn" style="margin-bottom:6px" data-act="addpay" data-name="${esc(name)}">＋ বেতন দেওয়া লিখুন</button>` : ""}
    ${list.length ? list.map(p => `<div class="prow"><span>${p.t.toLocaleDateString("bn-BD", { day: "numeric", month: "short", year: "numeric" })}${p.note ? " · " + esc(p.note) : ""}</span><b>${fmtMoney(p.amount)}${canEdit ? ` <span class="x" data-act="delpay" data-id="${p.id}">✕</span>` : ""}</b></div>`).join("") : `<div class="empty" style="padding:14px">এখনো কোনো বেতনের হিসাব নেই</div>`}
  </div>
  <div class="note">নির্ধারিত ডিউটি ${fmtDur(stdMs(st))}। দিনে এর বেশি কাজ করলে বাড়তি সময়ের জন্য ঘণ্টায় ${bn(otRate(st))} টাকা ধরে মিনিটে মিনিটে ওভারটাইম যোগ হয়।</div>`;
}

async function mark(type) {
  if (busy) return;
  busy = true; flash = "";
  try {
    const n = new Date();
    const write = addDoc(collection(db, "attendance"), {
      uid: cur.uid, email: cur.email, name: myName, type,
      shift: shiftOf(n), day: dayKey(n), ts: serverTimestamp()
    });
    await Promise.race([write, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    flash = type === "in" ? "✓ আসার সময় জমা হয়েছে" : "✓ যাওয়ার সময় জমা হয়েছে"; flashErr = false;
    if (type === "in") setRestEnd(0);
    else {
      const rm = Number((staffMap.get(myName) || {}).restMinutes) || 0;
      const outsNow = att.filter(r => r.type === "out" && dayKey(r.t) === dayKey(n)).length + 1;
      if (rm > 0 && outsNow < MAX_PER_DAY) setRestEnd(Date.now() + rm * 60000);
    }
  } catch { flash = "জমা নিশ্চিত হয়নি, ইন্টারনেট দেখুন"; flashErr = true; }
  busy = false; render();
  setTimeout(() => { flash = ""; render(); }, 4000);
}

function pickPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 256 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- alarms (in-app) ---------- */
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch {}
}
function beep() {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = 880; g.gain.value = 0.25;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.35);
  } catch {}
}
function stopRing() { const was = !!ringTimer; if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } ringEl.innerHTML = ""; if (was && navigator.vibrate) navigator.vibrate(0); }
async function notifyAlarm(a) {
  try {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) reg.showNotification("⏰ হাজিরা অ্যালার্ম", { body: fmtHM(a.time) + (a.label ? " · " + a.label : ""), icon: "icon-192.png", vibrate: [400, 200, 400], requireInteraction: true, tag: "alarm" });
    }
  } catch {}
}
function ring(a) {
  stopRing();
  ringEl.innerHTML = `<div class="ring"><div class="ringc"><div style="font-size:3rem">⏰</div><div class="rt">${fmtHM(a.time)}</div><div style="font-size:1.2rem;margin:8px 0 22px">${esc(a.label || "অ্যালার্ম")}</div><button class="btn" data-act="stopring">বন্ধ করুন</button></div></div>`;
  const pulse = () => { beep(); if (navigator.vibrate) navigator.vibrate([400, 200, 400]); };
  pulse(); ringTimer = setInterval(pulse, 1000);
  setTimeout(stopRing, 60000);
  notifyAlarm(a);
}
function checkAlarms() {
  if (mode !== "emp") return;
  const re = getRestEnd();
  if (re && Date.now() >= re) {
    setRestEnd(0);
    if (Date.now() - re < 600000) { ring({ id: "rest", time: hmOf(re), label: "রেস্ট শেষ, কাজে ফিরুন" }); return; }
  }
  const now = new Date(); const nm = now.getHours() * 60 + now.getMinutes();
  for (const a of alarms.concat(schedAlarms())) {
    if (a.target !== "all" && a.target !== myName) continue;
    if (a.date && a.date !== dayKey(now)) continue;
    const [h, m] = a.time.split(":").map(Number);
    const diff = nm - (h * 60 + m);
    if (diff < 0 || diff > 2) continue;
    const key = "rung_" + a.id + "_" + dayKey(now) + "_" + a.time;
    let seen = false;
    try { seen = !!localStorage.getItem(key); if (!seen) localStorage.setItem(key, "1"); } catch { seen = ringedMem.has(key); ringedMem.add(key); }
    if (seen) continue;
    ring(a); break;
  }
}

/* ---------- chat ---------- */
let msgs = [], gMsgs = [], dMsgs = [], chatRoom = null, stick = false;
const seenMem = {};
const mkey = m => m.room === "group" ? "group" : "dm:" + m.peer;
const seenAt = k => { try { return Number(localStorage.getItem("seen_" + cur.email + "_" + k)) || 0; } catch { return seenMem[k] || 0; } };
function markSeen(k) { seenMem[k] = Date.now(); try { localStorage.setItem("seen_" + cur.email + "_" + k, String(Date.now())); } catch {} }
const unreadIn = k => msgs.some(m => m.fromEmail !== cur.email && mkey(m) === k && m.t.getTime() > seenAt(k));
const unreadN = () => msgs.filter(m => m.fromEmail !== cur.email && m.t.getTime() > seenAt(mkey(m))).length;
const unreadDot = () => unreadN() > 0 ? `<span class="udot"></span>` : "";
function setMsgs() { const mp = new Map(); gMsgs.concat(dMsgs).forEach(m => mp.set(m.id, m)); msgs = [...mp.values()].sort((a, b) => a.t - b.t); }
const toMsg = d => { const x = d.data(); return { id: d.id, room: x.room, peer: x.peer, from: x.from, fromName: x.fromName, fromEmail: x.fromEmail, text: x.text, t: x.ts ? x.ts.toDate() : new Date() }; };
const roomKeyNow = () => chatRoom === "group" ? "group" : "dm:" + (mode === "admin" ? chatRoom : myName);
function roomMsgs() {
  if (chatRoom === "group") return msgs.filter(m => m.room === "group");
  const peer = mode === "admin" ? chatRoom : myName;
  return msgs.filter(m => m.room === "dm" && m.peer === peer);
}
const chatTime = d => dayKey(d) === dayKey(new Date()) ? tfmt(d) : d.toLocaleDateString("bn-BD", { day: "numeric", month: "short" }) + " " + tfmt(d);

function renderChatList() {
  root.dataset.chat = "";
  const rooms = [{ k: "group", label: "গ্রুপ চ্যাট" }].concat(allNames().map(n => ({ k: n, label: disp(n) })));
  root.innerHTML = `
  <div class="top"><button class="back" data-act="chatback">‹ ফিরে যান</button><div class="nm">💬 চ্যাট</div></div>
  <div class="pad">${rooms.map(r => {
    const grp = r.k === "group";
    const room = grp ? msgs.filter(m => m.room === "group") : msgs.filter(m => m.room === "dm" && m.peer === r.k);
    const last = room[room.length - 1];
    const un = unreadIn(grp ? "group" : "dm:" + r.k);
    const act = grp ? `data-act="room" data-room="group"` : `data-act="dm" data-name="${esc(r.k)}"`;
    const prev = last ? esc(((last.fromEmail === cur.email ? "আপনি: " : "") + last.text).slice(0, 60)) : "এখনো মেসেজ নেই";
    return `<button class="emp" ${act}>${grp ? `<div class="av sm" style="background:#0f6b4a">👥</div>` : avatar(r.k, "sm")}
      <div class="info"><div class="en">${esc(r.label)}${un ? `<span class="udot"></span>` : ""}</div><div class="es">${prev}</div></div></button>`;
  }).join("")}</div>`;
}

function renderChat() {
  if (mode === "admin" && !chatRoom) return renderChatList();
  const key = mode + ":" + chatRoom;
  let first = false;
  if (root.dataset.chat !== key || !document.getElementById("chatlist")) {
    first = true; root.dataset.chat = key;
    const title = chatRoom === "group" ? "👥 গ্রুপ চ্যাট" : "💬 " + (mode === "admin" ? disp(chatRoom) : "অ্যাডমিন");
    root.innerHTML = `
    <div class="top"><button class="back" data-act="chatback">‹ ফিরে যান</button><div class="nm">${esc(title)}</div></div>
    ${mode === "emp" ? `<div class="tabs"><button class="${chatRoom === "group" ? "on" : ""}" data-act="room" data-room="group">👥 গ্রুপ<span id="tdot_group"></span></button><button class="${chatRoom === "admin" ? "on" : ""}" data-act="room" data-room="admin">👤 অ্যাডমিন<span id="tdot_admin"></span></button></div>` : ""}
    <div class="chatpad"><div id="chatlist"></div></div>
    <div class="chatbar"><input id="chat_in" placeholder="মেসেজ লিখুন..." autocomplete="off"><button data-act="sendchat">পাঠান</button></div>`;
  }
  const list = roomMsgs();
  const el = document.getElementById("chatlist");
  const near = first || stick || window.innerHeight + window.scrollY >= document.body.scrollHeight - 140;
  stick = false;
  el.innerHTML = list.length ? list.map(m => {
    const mine = m.fromEmail === cur.email;
    return `<div class="bub ${mine ? "me" : ""}">${mine ? "" : `<div class="bnm">${esc(m.fromName || m.from)}</div>`}<div>${esc(m.text)}</div><div class="bt">${chatTime(m.t)}${mode === "admin" ? ` <span class="x" data-act="delmsg" data-id="${m.id}">✕</span>` : ""}</div></div>`;
  }).join("") : `<div class="empty">এখনো কোনো মেসেজ নেই। প্রথম মেসেজটা লিখুন!</div>`;
  markSeen(roomKeyNow());
  if (mode === "emp") {
    const tg = document.getElementById("tdot_group"), ta = document.getElementById("tdot_admin");
    if (tg) tg.innerHTML = chatRoom !== "group" && unreadIn("group") ? `<span class="udot"></span>` : "";
    if (ta) ta.innerHTML = chatRoom !== "admin" && unreadIn("dm:" + myName) ? `<span class="udot"></span>` : "";
  }
  if (near) window.scrollTo(0, document.body.scrollHeight);
}

function sendChat() {
  const inp = document.getElementById("chat_in");
  const text = inp ? inp.value.trim() : "";
  if (!text) return;
  inp.value = ""; stick = true;
  const adm = mode === "admin";
  const data = { text: text.slice(0, 1000), from: adm ? "admin" : myName, fromName: adm ? "অ্যাডমিন" : disp(myName), fromEmail: cur.email, ts: serverTimestamp() };
  if (chatRoom === "group") data.room = "group";
  else { const peer = adm ? chatRoom : myName; data.room = "dm"; data.peer = peer; data.peerEmail = peer + "@shop.app"; }
  addDoc(collection(db, "messages"), data).catch(() => { const i2 = document.getElementById("chat_in"); if (i2 && !i2.value) i2.value = text; });
}
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "chat_in") { e.preventDefault(); sendChat(); } });

/* ---------- actions ---------- */
function render() {
  if (view !== "chat") root.dataset.chat = "";
  if (mode === "emp") renderEmp(); else if (mode === "admin") renderAdmin();
}

document.addEventListener("change", async e => {
  if (e.target.id !== "m_photo" || !e.target.files[0]) return;
  try {
    pendingPhoto = await pickPhoto(e.target.files[0]);
    document.getElementById("m_prev").innerHTML = `<div class="av sm"><img src="${pendingPhoto}" alt=""></div>`;
  } catch { merr("ছবি পড়া যায়নি"); }
});

document.addEventListener("click", async e => {
  unlockAudio();
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  if (b.dataset.act === "bg" && e.target.closest("[data-stop]")) return;
  const a = b.dataset.act, id = b.dataset.id, name = b.dataset.name;
  try {
    if (a === "in" || a === "out") mark(a);
    else if (a === "logout") signOut(auth);
    else if (a === "prev") { offset--; render(); }
    else if (a === "next") { if (offset < 0) offset++; render(); }
    else if (a === "open") { sel = name; view = "profile"; window.scrollTo(0, 0); render(); }
    else if (a === "home") { sel = null; view = "home"; window.scrollTo(0, 0); render(); }
    else if (a === "alarms") { view = "alarms"; render(); }
    else if (a === "salary") { if (mode === "admin") sel = name; view = "salary"; window.scrollTo(0, 0); render(); }
    else if (a === "back") { view = mode === "admin" ? "profile" : "home"; window.scrollTo(0, 0); render(); }
    else if (a === "chat") { view = "chat"; chatRoom = mode === "admin" ? null : "group"; window.scrollTo(0, 0); render(); }
    else if (a === "dm") { view = "chat"; chatRoom = name; window.scrollTo(0, 0); render(); }
    else if (a === "room") { chatRoom = b.dataset.room; window.scrollTo(0, 0); render(); }
    else if (a === "chatback") { if (mode === "admin" && chatRoom) chatRoom = null; else { view = "home"; chatRoom = null; } window.scrollTo(0, 0); render(); }
    else if (a === "sendchat") sendChat();
    else if (a === "delmsg") { if (confirm("মেসেজ মুছবেন?")) await deleteDoc(doc(db, "messages", id)); }
    else if (a === "closemodal" || a === "bg") closeModal();
    else if (a === "stopring") stopRing();
    else if (a === "enablealarm") { if (typeof Notification !== "undefined") await Notification.requestPermission(); render(); }
    else if (a === "editprof") modalProfile(name);
    else if (a === "editrec") modalRec(id);
    else if (a === "addrec") modalAddRec(name);
    else if (a === "addpay") modalPay(name);
    else if (a === "addalarm") modalAlarm();
    else if (a === "editalarm") modalAlarm(id);
    else if (a === "addstaff") modalStaff();
    else if (a === "saveprof") {
      const data = {};
      if (mode === "admin") {
        data.name = val("m_name") || cap(name); data.salary = Number(val("m_sal")) || 0; data.restMinutes = Number(val("m_rest")) || 0; data.offDay = Number(val("m_off"));
        const sc = { in: val("m_s_in"), bo: val("m_s_bo"), bi: val("m_s_bi"), out: val("m_s_out") };
        const filled = Object.values(sc).filter(Boolean).length;

        data.sched = filled ? sc : null;
        data.otRate = Number(val("m_otr")) || 0;
      }
      data.phone = val("m_phone");
      if (pendingPhoto) data.photo = pendingPhoto;
      await setDoc(doc(db, "staff", name), data, { merge: true }); closeModal();
    }
    else if (a === "saverec") {
      const d = new Date(val("m_dt")); if (isNaN(d)) return merr("সময় ঠিক নেই");

    }

      closeModal();
    }
    else if (a === "savepay") {
      const amt = Number(val("m_amt")); if (!amt) return merr("পরিমাণ লিখুন");
      const d = new Date(val("m_date") + "T12:00:00");
      await addDoc(collection(db, "payments"), { email: name + "@shop.app", name, amount: amt, note: val("m_note"), date: Timestamp.fromDate(d), createdAt: serverTimestamp() });
      closeModal();
    }

      if (id) await updateDoc(doc(db, "alarms", id), ad);
      else await addDoc(collection(db, "alarms"), { ...ad, createdAt: serverTimestamp() });
      closeModal();
    }
    else if (a === "delalarm") { if (confirm("অ্যালার্ম মুছবেন?")) await deleteDoc(doc(db, "alarms", id)); }
    else if (a === "savestaff") {
      const u = val("m_user").toLowerCase(), pin = val("m_pin");
      if (!/^[a-z0-9._-]+$/.test(u)) return merr("নাম শুধু ইংরেজি ছোট হাতের অক্ষর/সংখ্যা হবে");
      if (pin.length < 6) return merr("পিন কমপক্ষে ৬ সংখ্যা");
      merr("যোগ হচ্ছে...");
      const sec = initializeApp(firebaseConfig, "sec" + Date.now());

        const sa = getAuth(sec);
        await createUserWithEmailAndPassword(sa, u + "@shop.app", pin);

      } finally { await deleteApp(sec); }
      await setDoc(doc(db, "staff", u), { name: val("m_name") || cap(u), phone: val("m_phone"), salary: Number(val("m_sal")) || 0, createdAt: serverTimestamp() });
      closeModal();
    }
  } catch (err) {
    const m = err && err.code === "auth/email-already-in-use" ? "এই নামে আগেই অ্যাকাউন্ট আছে" : "হয়নি: " + ((err && (err.code || err.message)) || "error");
    merr(m);
  }
});

const toRec = d => { const x = d.data(); return { id: d.id, name: x.name, type: x.type, t: x.ts ? x.ts.toDate() : new Date() }; };
const byTime = (a, b) => a.t - b.t;
const stop = () => { unsubs.forEach(u => u()); unsubs = []; };

onAuthStateChanged(auth, user => {
  stop();
  if (timer) clearInterval(timer);
  if (atimer) clearInterval(atimer);
  att = []; pays = []; alarms = []; staffMap = new Map(); msgs = []; gMsgs = []; dMsgs = []; chatRoom = null;
  offset = 0; view = "home"; sel = null; flash = ""; closeModal(); stopRing();
  if (!user) return showLogin();
  cur = user;
  const toPay = d => { const x = d.data(); return { id: d.id, name: x.name, amount: x.amount, note: x.note, t: x.date ? x.date.toDate() : new Date() }; };
  const onAlarms = snap => { alarms = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); checkAlarms(); };
  if (user.email === ADMIN_EMAIL) {
    mode = "admin";
    unsubs.push(onSnapshot(query(collection(db, "attendance"), orderBy("ts", "desc"), limit(3000)), s => { att = s.docs.map(toRec).sort(byTime); render(); },
      () => { root.innerHTML = `<div class="empty" style="padding-top:30vh">ডেটা আনা যায়নি। ইন্টারনেট ও রুলস দেখুন।</div>`; }));
    unsubs.push(onSnapshot(collection(db, "staff"), s => { staffMap = new Map(s.docs.map(d => [d.id, d.data()])); render(); }));
    unsubs.push(onSnapshot(collection(db, "payments"), s => { pays = s.docs.map(toPay); render(); }));
    unsubs.push(onSnapshot(collection(db, "alarms"), onAlarms));
    unsubs.push(onSnapshot(query(collection(db, "messages"), orderBy("ts", "desc"), limit(500)), s => { gMsgs = s.docs.map(toMsg); dMsgs = []; setMsgs(); render(); }));
  } else {
    mode = "emp"; myName = user.email.split("@")[0];
    unsubs.push(onSnapshot(query(collection(db, "attendance"), where("email", "==", user.email)), s => { att = s.docs.map(toRec).sort(byTime); render(); }));
    unsubs.push(onSnapshot(doc(db, "staff", myName), s => { staffMap = new Map(s.exists() ? [[myName, s.data()]] : []); render(); }));
    unsubs.push(onSnapshot(query(collection(db, "payments"), where("email", "==", user.email)), s => { pays = s.docs.map(toPay); render(); }));
    unsubs.push(onSnapshot(collection(db, "alarms"), onAlarms));
    unsubs.push(onSnapshot(query(collection(db, "messages"), where("room", "==", "group")), s => { gMsgs = s.docs.map(toMsg); setMsgs(); render(); }));
    unsubs.push(onSnapshot(query(collection(db, "messages"), where("peerEmail", "==", user.email)), s => { dMsgs = s.docs.map(toMsg); setMsgs(); render(); }));
  }
  render();
  timer = setInterval(render, 20000);
  atimer = setInterval(checkAlarms, 10000);
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
